<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340"
     role="img" aria-label="NightRider77 — PXN Stores LK. VPN clients, control panels, automation. Route: Colombo to Singapore to the open internet.">
  <title>NightRider77 — PXN Stores LK</title>
  <defs>
    <!-- Toxic-flesh green, bone and dried blood, lifted straight off the avatar. -->
    <radialGradient id="halo" cx="14%" cy="8%" r="85%">
      <stop offset="0%"   stop-color="#8FD14F" stop-opacity=".20"/>
      <stop offset="45%"  stop-color="#8FD14F" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#8FD14F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8FD14F" stop-opacity=".9"/>
      <stop offset="52%"  stop-color="#C7F76E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8FD14F" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#C7F76E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C7F76E" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8FD14F" opacity=".10"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".28"/>
    </pattern>
    <!-- Phosphor bleed: a blurred green ghost UNDER crisp type, never over it. -->
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "DejaVu Sans Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      @keyframes run   { 0% { transform: translateX(0); opacity: 0 }
                         7% { opacity: 1 }
                        92% { opacity: 1 }
                       100% { transform: translateX(1056px); opacity: 0 } }
      @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }
      /* backwards fill-mode keeps a delayed packet invisible instead of parking it lit at the origin */
      .pkt  { opacity: 0; animation: run 5s cubic-bezier(.5,0,.5,1) infinite both; }
      .pkt2 { animation-delay: 2.5s; }
      .live { animation: pulse 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .pkt, .live { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="340" fill="#060806"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#halo)"/>

  <!-- identity -->
  <text class="mono" x="72" y="86" fill="#4F6140" font-size="14" letter-spacing="5.5">PXN STORES LK — COLOMBO, SRI LANKA</text>
  <g class="mono" font-size="62" font-weight="700" letter-spacing="-1">
    <text x="72" y="158" fill="#8FD14F" opacity=".45" filter="url(#soft)">NightRider77</text>
    <text x="72" y="158" fill="#EAEEE4">NightRider77</text>
  </g>
  <rect x="72" y="180" width="132" height="3" fill="#A32424"/>
  <text class="mono" x="72" y="214" fill="#8FD14F" font-size="16.5" letter-spacing="2.5">VPN CLIENTS &#183; CONTROL PANELS &#183; AUTOMATION</text>

  <!-- status -->
  <g transform="translate(1128 74)">
    <rect x="-198" y="-20" width="198" height="34" rx="17" fill="#0B0F0B" stroke="#8FD14F" stroke-opacity=".35"/>
    <circle class="live" cx="-176" cy="-3" r="4.5" fill="#8FD14F"/>
    <text class="mono" x="-162" y="2" fill="#8FD14F" font-size="12.5" letter-spacing="2.4">FLEET OPERATIONAL</text>
  </g>

  <!-- what each surface is actually built on -->
  <g class="mono" font-size="13">
    <text x="768" y="152" fill="#3E4C34" letter-spacing="2.6">ANDROID</text>
    <text x="900" y="152" fill="#9CA893">Kotlin &#183; v2rayNG core</text>
    <text x="768" y="180" fill="#3E4C34" letter-spacing="2.6">WINDOWS</text>
    <text x="900" y="180" fill="#9CA893">C# / WPF &#183; v2rayN core</text>
    <text x="768" y="208" fill="#3E4C34" letter-spacing="2.6">WEB</text>
    <text x="900" y="208" fill="#9CA893">React &#183; Supabase &#183; Deno</text>
  </g>

  <!-- the route: what the whole estate actually does -->
  <g>
    <line x1="72" y1="272" x2="1128" y2="272" stroke="#22301B" stroke-width="3"/>
    <line x1="72" y1="272" x2="1128" y2="272" stroke="url(#wire)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>

    <g class="pkt">
      <rect x="26" y="270.5" width="46" height="3" fill="url(#trail)" rx="1.5"/>
      <circle cx="72" cy="272" r="8" fill="#C7F76E" opacity=".3" filter="url(#soft2)"/>
      <circle cx="72" cy="272" r="3.6" fill="#EAFFC4"/>
    </g>
    <g class="pkt pkt2">
      <rect x="26" y="270.5" width="46" height="3" fill="url(#trail)" rx="1.5"/>
      <circle cx="72" cy="272" r="8" fill="#C7F76E" opacity=".3" filter="url(#soft2)"/>
      <circle cx="72" cy="272" r="3.6" fill="#EAFFC4"/>
    </g>

    <g fill="#060806" stroke="#8FD14F" stroke-width="2">
      <circle cx="72" cy="272" r="6"/><circle cx="600" cy="272" r="6"/><circle cx="1128" cy="272" r="6"/>
    </g>
    <g class="mono" fill="#8FD14F" font-size="12.5" letter-spacing="3">
      <text x="72" y="302">CMB</text>
      <text x="600" y="302" text-anchor="middle">SIN</text>
      <text x="1128" y="302" text-anchor="end">OPEN NET</text>
    </g>
    <text class="mono" x="600" y="254" fill="#4F6140" font-size="11.5" letter-spacing="3" text-anchor="middle">XRAY &#183; VLESS &#183; TLS</text>
  </g>

  <rect width="1200" height="340" fill="url(#scan)" pointer-events="none"/>
</svg>
